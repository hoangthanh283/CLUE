defaults:
  - scenario: single_funsd
  - method: naive
  - model: layoutlmv3_base
  - training: default
  - _self_

seed: 42
output_dir: ./results

wandb:
  project: doccl-aaai2027
  mode: online  # set to "offline" for vast.ai with no internet

tensorboard:
  # Live forgetting diagnostic (retention-matrix heatmap + per-task curves) written
  # to results/<run>/tb. View with: tensorboard --logdir results
  enabled: true
  # Deep diagnostics: per-component/depth weight histograms (every epoch) + old-task
  # Fisher-weighted displacement at task boundaries (where forgetting lives). Heavier
  # (an extra Fisher pass per boundary) — OFF for the grid, enable for analysis runs:
  #   tensorboard.diagnostics=true
  diagnostics: false
