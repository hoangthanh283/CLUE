experiment_name: "layoutlmv3_funsd"

# Dataset configuration
dataset:
  name: "funsd"
  hf_dataset_name: "nielsr/funsd"
  task_type: "token_classification"
  preprocessing:
    max_seq_length: 512
    max_position_embeddings: 1024
    image_size: [224, 224]
    apply_ocr: false  # FUNSD already has OCR annotations
    normalize_bbox: true
    include_image: false  # Disable visual features for LayoutLMv3

# Model configuration  
model:
  name: "layoutlmv3"
  model_type: "layoutlmv3-base"
  pretrained_model_name: "microsoft/layoutlmv3-base"
  config:
    num_labels: 7  # O, B-HEADER, I-HEADER, B-QUESTION, I-QUESTION, B-ANSWER, I-ANSWER
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    classifier_dropout: 0.1

# Training configuration
training:
  batch_size: 2
  gradient_accumulation_steps: 4
  num_epochs: 100
  learning_rate: 5.e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  optimizer: "adamw"
  scheduler: "linear"
  save_strategy: null
  evaluation_strategy: "epoch"
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "f1"  # Changed from eval_f1 to match compute_metrics output
  greater_is_better: true
  early_stopping_patience: 10

# Data processing
data_processing:
  train_split: "train"
  test_split: "test" 
  validation_split: 0.1  # Split from train if no validation set
  shuffle_train: true
  seed: 42

# Continual Learning Strategy
cl_strategy:
  name: "none"  # baseline without CL

# Evaluation settings
evaluation:
  metrics: ["accuracy", "f1", "precision", "recall"]
  save_predictions: true
  compute_entity_level_f1: true

# Logging and output
output:
  log_level: "INFO"
  save_model: true
  save_tokenizer: true
  push_to_hub: false

# Weights & Biases (wandb) experiment tracking (optional)
# To enable wandb tracking, set use_wandb to true and provide your credentials
wandb:
  use_wandb: false  # Set to true to enable wandb tracking
  wandb_entity: null
  wandb_project: null
  #wandb_api_key: null  # Use WANDB_API_KEY env var
  tags: ["layoutlm", "funsd", "information_extraction"]
