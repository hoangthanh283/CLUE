experiment_name: "layoutlmv3_gem_task_il"

dataset:
  name: "funsd"
  hf_dataset_name: "nielsr/funsd"
  task_type: "token_classification"
  preprocessing:
    max_seq_length: 512
    max_position_embeddings: 1024
    image_size: [224, 224]
    apply_ocr: false
    normalize_bbox: true
    include_image: false

model:
  name: "layoutlmv3"
  model_type: "layoutlmv3-base"
  pretrained_model_name: "microsoft/layoutlmv3-base"
  config:
    num_labels: 7
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    classifier_dropout: 0.1

cl_setting: "task_il"

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 100
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  optimizer: "adamw"
  scheduler: "linear"
  save_strategy: null
  evaluation_strategy: "epoch"
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: "f1"
  greater_is_better: true
  early_stopping_patience: 10

data_processing:
  train_split: "train"
  test_split: "test"
  validation_split: 0.1
  shuffle_train: true
  seed: 42

cl_strategy:
  name: "gem"                   # Task-IL with GEM fine-tuning
  memory_size: 500              # Total episodic memory samples across all tasks
  samples_per_task: 64          # Samples per task for computing constraint gradients (increased from 5)
  max_tasks: 5                  # Maximum number of previous tasks to enforce constraints for
  # QP solver settings
  qp_tolerance: 1e-3            # Convergence tolerance for constraint satisfaction
  qp_regularization: 1e-6       # Regularization for numerical stability in QP solver
  margin: 0.5                   # Constraint margin (matches original GEM implementation)

  # Memory management
  clear_cache_every: 5          # Clear GPU cache every N steps to prevent OOM

label_space:
  unified: false  # Task-IL uses separate classifier per task

tasks:
  - name: "funsd"
    dataset:
      name: "funsd"
      hf_dataset_name: "nielsr/funsd"
  - name: "cord"
    dataset:
      name: "cord"
      hf_dataset_name: "naver-clova-ix/cord-v2"
  - name: "sroie"
    dataset:
      name: "sroie"
      hf_dataset_name: "buthaya/sroie"
  - name: "wildreceipt"
    dataset:
      name: "wildreceipt"
      hf_dataset_name: "kaydee/wildreceipt"
  - name: "xfund_zh"
    dataset:
      name: "xfund"
      hf_dataset_name: "nnul/xfund-multilingual"
      language: "zh"

evaluation:
  metrics: ["accuracy", "f1", "precision", "recall"]
  save_predictions: false

output:
  log_level: "INFO"
  save_model: true
  save_tokenizer: true
  push_to_hub: false

wandb:
  use_wandb: true
  wandb_entity: null
  wandb_project: "cl4ie"
  #wandb_api_key: null  # Use WANDB_API_KEY env var
  tags: ["layoutlmv3", "task_il", "gem", "exact_qp", "replication", "funsd", "cord", "sroie", "wildreceipt", "xfund"]
