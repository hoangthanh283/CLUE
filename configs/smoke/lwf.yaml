experiment_name: "smoke_lwf"

dataset:
  name: "funsd"
  hf_dataset_name: "nielsr/funsd"
  task_type: "token_classification"
  preprocessing:
    max_seq_length: 512
    max_position_embeddings: 1024
    image_size: [224, 224]
    apply_ocr: false
    normalize_bbox: true
    include_image: false

model:
  name: "layoutlmv3"
  model_type: "layoutlmv3-base"
  pretrained_model_name: "microsoft/layoutlmv3-base"
  config:
    # Overridden at runtime to len(UNIFIED_LABEL_LIST) by train_cl.py
    num_labels: 51
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    classifier_dropout: 0.1

cl_setting: "class_il"

training:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.0
  optimizer: "adamw"
  scheduler: "none"
  save_strategy: null
  evaluation_strategy: "epoch"
  save_total_limit: 1
  load_best_model_at_end: false
  metric_for_best_model: "f1"
  greater_is_better: true
  early_stopping_patience: 999

data_processing:
  train_split: "train"
  test_split: "test"
  validation_split: 0.1
  shuffle_train: false
  seed: 42

cl_strategy:
  name: "lwf"
  lwf_alpha: 0.5
  lwf_temperature: 2.0

# LwF requires unified label space (fixed head size for distillation)
label_space:
  unified: true

tasks:
  - name: "funsd"
    dataset:
      name: "funsd"
      hf_dataset_name: "nielsr/funsd"
  - name: "cord"
    dataset:
      name: "cord"
      hf_dataset_name: "naver-clova-ix/cord-v2"

evaluation:
  metrics: ["accuracy", "f1", "precision", "recall"]
  save_predictions: false

output:
  log_level: "INFO"
  save_model: false
  save_tokenizer: false
  push_to_hub: false

wandb:
  use_wandb: false
  wandb_entity: null
