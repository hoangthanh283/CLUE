name: hrp
lr: 5.0e-5
weight_decay: 0.01
epochs: 10
max_grad_norm: 1.0
# Router engine: dense (== L2P) | sparse (BM25-over-OCR only) | hybrid (RRF fusion).
router: hybrid
# Pool = n_tasks blocks of slots_per_task slots each (task-pinned).
n_tasks: 10
slots_per_task: 2
prompt_length: 5
top_k: 2
lambda_key: 0.5
rrf_k: 60
# Head protection: replay past examples (pinned to their own block) to keep the shared
# classifier head from drifting. weight 0 disables it (router-only ablation).
head_replay_weight: 1.0
head_buffer_size: 200
replay_batch_size: 8
