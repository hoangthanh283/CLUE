name: lexmem_v3
# LexMem v3 — v2's diagnosis-guided freeze map + EWC on the plastic bucket.
# The v2 pilot proved the seesaw: freeze-all = perfect retention / no learning
# (SROIE 3.4); freeze-locus-only = full learning (82.7/98.0) / total forgetting
# (BWT -76.8), driven by measured pressure-redirection drift in the early/mid
# layers (task-0 feature CKA 0.19; the no-memory control matched, CKA 0.18-0.33).
# v3 adds the pre-planned counter: online EWC restricted to the TRAINABLE
# early/mid bucket — stability regularized where plasticity lives, memory
# architectural where forgetting lives. Drift probe gives the tuning signal
# (target: CKA ~0.7+ with new-task F1 still >= 75).
lr: 5.0e-5
weight_decay: 0.01
epochs: 10
max_grad_norm: 1.0
early_stop_patience: 4
# Memory geometry (unchanged from v2).
n_slots: 65536
top_k: 32
temp: 0.05
value_space: feature
key_init: kmeans
kmeans_iters: 8
key_sample_cap: 200000
select: tfidf
top_t: 4096
mem_optimizer: adamw
lr_mem: 5.0e-3
# Diagnosis-guided freeze map (unchanged from v2).
freeze_late_n: 4
drift_probe_batches: 4
mem_enabled: true
# EWC on the plastic bucket (the v3 addition). Online accumulation across tasks.
ewc_lambda: 1000.0
fisher_n_samples: 200
