name: colar_r
run_alias: colar_r_sliced2_oracle
# Ceiling for the double-sliced CoLaR-R (2026-11-02): current-side slice + sliced replay
# while a document is stale, PLUS true-label refresh after each task (oracle; not deployable).
# Separates "remove the stale gradients" (sliced2) from "add the missing positives" (oracle).
refresh: oracle
current_sliced: true
lr: 5.0e-5
weight_decay: 0.01
epochs: 10
max_grad_norm: 1.0
split_layer_k: 8
docs_per_task: 5
replay_batch_size: 4
rank_r: 64
