name: colaslot_shadow

lr: 5.0e-5
weight_decay: 0.01
epochs: 10
max_grad_norm: 1.0
split_layer_k: 8
docs_per_task: 5
replay_batch_size: 4
rank_r: 64

# Exact CoLaR trains with every sidecar off. A shared rank-16 shadow adapts the plastic
# upper layers on the same current+replay batch; aged lexical owners read it at evaluation.
freeze_lower: false
infer_gate: true
store_input_ids: true
routing_mode: hard_top1
route_margin: 0.05
slot_depth: head_only
slot_sharing: "off"
share_threshold: 0.5
n_tasks: 6
n_slots_head: 48
n_slots_late: 18
repr_rank: 16
lexical_signal: ocr
