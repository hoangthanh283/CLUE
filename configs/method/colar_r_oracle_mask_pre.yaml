name: colar_r
run_alias: colar_r_oracle_mask_pre
# Mask-only counterpart of colar_r_oracle_pre (R18 E2b): before each session (and at each
# boundary) every stored token the oracle would relabel (an O whose true class is in the head now)
# is set to -100 instead, so the false negatives leave the replay loss and no label is added.
# Otherwise identical to colar_r_oracle_pre.yaml. Headline recipe k=4 / d=50 / r=128 via CLI.
refresh: oracle_mask
refresh_before_task: true
lr: 5.0e-5
weight_decay: 0.01
epochs: 10
max_grad_norm: 1.0
split_layer_k: 8
docs_per_task: 5
replay_batch_size: 4
rank_r: 64
