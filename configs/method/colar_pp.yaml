# CoLaR++ (docs/IMAGE_SCOPE_PREREG.md Amendment 5). All switches default OFF here; arms
# turn them on via CLI. rank_r: 0 = raw latent bank.
name: colar_pp
lr: 5.0e-5
weight_decay: 0.01
epochs: 100
max_grad_norm: 1.0
split_layer_k: 4
docs_per_task: 500
rank_r: 0
replay_batch_size: 16
replay_task_balance: true
head_align_epochs: 0
head_align_lr: 5.0e-3
head_align_batch: 64
trunk_lr_scale: 1.0
weight_align: false
replay_balance: none
quant: none
token_pool: 1
latent_distill: 0.0     # LD: weight of logit-MSE on replay (Amendment 6)
token_drop: 0.0         # TD: fraction of patch tokens dropped per replayed latent
feature_anchor: 0.0     # S2: weight of (1 - cos) between current and banked CLS feature
analytic_head: none     # S1: "rp" = RanPAC-style ridge head re-solved on recomputed stored latents
rp_fit: stored+current  # S1 fit set: stored latents only, or + current task full data
rp_dim: 10000
dump_final: false       # save final_model.pt + final_store.pt for the RCA probes
drift_comp: false        # I1: drift-compensated full-data class Gaussians for head alignment
ca_samples_per_cls: 256
trunk_adapt: full        # I2: "lora" = low-rank adapters on layers >= k after task 0
lora_rank: 8
lora_lr: 5.0e-4
keep_tokens: all         # D (documents): "labeled" keeps only labelled first-subword text positions
visual_tokens: keep      # D (documents): "drop" discards the 197 visual patch positions
max_tokens_per_cls: 20000
