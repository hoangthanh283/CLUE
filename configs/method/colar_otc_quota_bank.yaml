name: colar_otc
run_alias: colar_otc_quota_bank
# Gate 1b v2 (pages are banked with their completed labels): two-sided label completion under one shared
# softmax, rule = quota. Stored documents stay sliced until they are completed
# (refresh: sliced_pseudo); the current side trains with plain CE on the completed labels.
refresh: sliced_pseudo
completion: quota
bank_completed: true
lr: 5.0e-5
weight_decay: 0.01
epochs: 10
max_grad_norm: 1.0
split_layer_k: 4
docs_per_task: 50
replay_batch_size: 4
rank_r: 128
