name: colar_r
run_alias: colar_r_sliced2
# CoLaR-R "double-sliced" (2026-11-02): sliced replay CE (capture-time classes) PLUS the
# mirror slice on the CURRENT session — tokens labelled O in CIL-masked current data take
# their CE over {O} ∪ new classes only, so an old-class prediction on a stale-O token is
# neither rewarded nor punished. Removes the current↔replay conflict that made the sliced
# run's new-session val-F1 oscillate (82→27, 45→5→51→5 on CIL-CORD seed 42).
refresh: sliced
current_sliced: true
lr: 5.0e-5
weight_decay: 0.01
epochs: 10
max_grad_norm: 1.0
split_layer_k: 8
docs_per_task: 5
replay_batch_size: 4
rank_r: 64
