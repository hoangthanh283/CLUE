name: colar_sbr_recall
# CoLaR-SBR-Recall (2026-11-06): SBR whose blocks are read under per-session LoRA deltas of
# the upper trunk (base frozen after task 0). The bank stores brain-states, not just latents.
# See doccl/methods/colar_sbr_recall.py.
sbr_threshold: 0.5
lora_rank: 8
lora_alpha: 16
target_modules: [query, key, value]
lr: 5.0e-5
weight_decay: 0.01
epochs: 10
max_grad_norm: 1.0
split_layer_k: 8
docs_per_task: 5
replay_batch_size: 4
rank_r: 64
