[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doccl"
version = "0.1.0"
description = "Continual Learning for Document Understanding — AAAI 2027 submission"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thanh Hoang", email = "thanh.hoang@hust.edu.vn" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # torch/torchvision floors kept at 2.2.0/0.17.0 to MATCH common prebuilt GPU images
    # (e.g. pytorch/pytorch:2.2.0-cuda12.1). A higher floor (was 2.3.0) forces pip to
    # UPGRADE the image's torch and re-download the whole ~4GB nvidia-* CUDA wheel stack
    # on every fresh rented box — pure waste, since the code uses no torch>=2.3 API.
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "datasets>=4.0.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "sentencepiece>=0.2.0",
    "Pillow>=10.3.0",
    "torchvision>=0.17.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "wandb>=0.17.0",
    "tensorboard>=2.16.0",
    "seqeval>=1.2.2",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

# Console entry points. Training is intentionally NOT exposed here: scripts/train.py
# is a Hydra entry that lives outside the installed package — run it directly with
# `python scripts/train.py method=naive scenario=single_funsd`.
[project.scripts]
doccl-pilot = "doccl.pilot.run_pilot:main"
doccl-pilot-analyze = "doccl.pilot.analyze:main"

[tool.setuptools.packages.find]
include = ["doccl*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # handled by black

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take >30 seconds",
    "gpu: tests requiring GPU",
    "integration: end-to-end integration tests",
]
