[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "cl4ie"
version = "0.1.0"
description = "Continual Learning for Information Extraction on Document Images using LayoutLM"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Thanh", email = "thanh@example.com"}
]
license = {text = "MIT"}

dependencies = [
    "torch>=2.1.0,<3.0",
    "transformers>=4.30.0,<5.0",
    "datasets>=2.10.0,<5.0",
    "evaluate>=0.4.0,<1.0",
    "pillow>=9.5.0",
    "timm>=0.9.0,<2.0",
    "numpy>=1.23.0,<2.0",
    "pandas>=1.5.0,<3.0",
    "scikit-learn>=1.2.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "omegaconf>=2.3.0,<4.0",
    "hydra-core>=1.3.0,<2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.12.0",
    "wandb>=0.16.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "opencv-python>=4.7.0",
    "pytesseract>=0.3.10",
    "pydantic>=1.10.0,<3.0",
    "seqeval>=1.2.2",
    "quadprog>=0.1.11",
    "openhands-ai>=1.0.0",
    "langgraph>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
]

[tool.uv]
managed = true

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
[tool.isort]
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

